<!DOCTYPE html>
<html>

<head>
    <title>Terai Flood Alert System</title>
</head>

<body style="
background:#121212;
font-family:Arial,sans-serif;
text-align:center;
padding-top:50px;
">

<h1 style="
color:#00d4ff;
font-size:45px;
margin-bottom:10px;
">
            〰〰〰
    Terai Flood Alert System
</h1>

<p style="
font-size:20px;
color:#cccccc;
margin-bottom:40px;
">
River Monitoring & Flood Alerts For Nepal
</p>

<label for="river" style="color:white;font-size:18px;">
Select River
</label>

<br><br>

<select id="river"
style="
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
width:220px;
">
    <option value="Bheri">Bheri</option>
    <option value="Bagmati">Bagmati</option>
    <option value="Koshi">Koshi</option>
    <option value="Karnali">Karnali</option>
    <option value="Rapti">Rapti</option>
    <option value="Mahakali">Mahakali</option>
    <option value="Narayani">Narayani</option>
    <option value="Seti">Seti</option>
</select>

<br><br>

<button
onclick="sendRequest()"
style="
background:#0078d4;
color:white;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
">
🚨 View River Status
</button>

<br><br>

<div
id="result"
style="
margin-top:30px;
padding:20px;
background:#1e1e1e;
color:#ffffff;
width:500px;
margin-left:auto;
margin-right:auto;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,0.3);
font-size:20px;
font-weight:bold;
">
Results Will Appear Here
</div>
<script>

async function sendRequest() {

    let river = document.getElementById("river").value;

    document.getElementById("result").innerHTML =
    "Checking " + river + "...";

    try {

        const response = await fetch(
            "https://mxmbdzidz1.execute-api.ap-northeast-3.amazonaws.com/alert",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    RiverName:river
                })
            }
        );

        const result = await response.text();

        let resultBox =
        document.getElementById("result");

        resultBox.innerHTML = result;

        if(result.includes("Danger")){
            resultBox.style.color="red";
        }
        else if(result.includes("Warning")){
            resultBox.style.color="orange";
        }
        else{
            resultBox.style.color="green";
        }

    }

    catch(error){

        document.getElementById("result").innerHTML =
        "Error: " + error;

    }

}

</script>

<hr style="margin-top:60px;">

<p style="color:#777;">
Developed by Nitish | Serverless AWS Architecture
</p>

</body>
</html>
